name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull the changes
        working-directory: ~/simple-website-astro
        run: git pull

      - name: Copy built website files
        run: sudo rsync -vP ~/simple-website-astro/dist/* /var/www/simple-website-astro/
